dependencies {
    api project (":eventuate-common-micronaut-jdbc")
    testImplementation project (":eventuate-common-jdbc-tests")
    testImplementation project (":eventuate-common-micronaut-id")

    api "jakarta.persistence:jakarta.persistence-api:3.1.0"
    api "io.micronaut.data:micronaut-data-jdbc:$micronautDataVersion"

    // Prevent javadoc error
    compileOnly 'jakarta.interceptor:jakarta.interceptor-api:2.1.0'

    implementation "jakarta.inject:jakarta.inject-api:2.0.1"

    annotationProcessor "io.micronaut.data:micronaut-data-processor:$micronautDataVersion"
    annotationProcessor "io.micronaut:micronaut-inject-java:$micronautVersion"
    annotationProcessor "io.micronaut:micronaut-validation:$micronautVersion"
    annotationProcessor "io.micronaut.configuration:micronaut-openapi:$micronautVersion"
    api "io.micronaut:micronaut-inject:$micronautVersion"
    api "io.micronaut:micronaut-validation:$micronautVersion"
    api "io.micronaut:micronaut-runtime:$micronautVersion"
    testAnnotationProcessor "io.micronaut:micronaut-inject-java:$micronautVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testImplementation "io.micronaut.test:micronaut-test-junit5:$micronautVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    testRuntimeOnly "io.micronaut.sql:micronaut-jdbc-hikari:$micronautVersion"
}

// use JUnit 5 platform
test {
    useJUnitPlatform()
}
